services:
  postgres:
    image: postgres:18-alpine
    container_name: collecte-db
    ports:
      - target: 5432
        published: 5432
    environment:
      POSTGRES_DB: ecc
      POSTGRES_USER: ecc
      POSTGRES_PASSWORD: ecc
    volumes:
      - type: volume
        source: postgres_data_18
        target: /var/lib/postgresql
    command: ["postgres", "-c", "log_statement=all", "-c", "max_connections=100"]

  keycloak:
    image: keycloak/keycloak:26.5.3
    container_name: collecte-keycloak
    ports:
      - target: 8080
        published: 8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - type: volume
        source: keycloack-data
        target: /opt/keycloak/data
      - type: bind
        source: ./deploy/local/collecte-pro-realm.json
        target: /opt/keycloak/data/import/collecte-pro-realm.json
        read_only: true
    command: ["start-dev", "--import-realm"]

  keycloak_oidc:
    image: keycloak/keycloak:26.5.3
    container_name: collecte-keycloak-oidc
    ports:
      - target: 8080
        published: 8081
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Pin a fixed hostname so the issuer stays consistent whether the
      # request comes from the browser (localhost:8081) or from the main
      # Keycloak's backchannel calls (keycloak_oidc:8080), avoiding
      # "Invalid token issuer" errors during identity brokering.
      KC_HOSTNAME: http://localhost:8081
    volumes:
      - type: volume
        source: keycloack-data-oidc
        target: /opt/keycloak/data
    command: ["start-dev", "--import-realm"]

volumes:
  postgres_data_18:
  keycloack-data:
  keycloack-data-oidc:
