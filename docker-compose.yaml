services:
  postgres:
    image: postgres:15.15-alpine
    container_name: collecte-db
    ports:
      - target: 5432
        published: 5432
    environment:
      POSTGRES_DB: ecc
      POSTGRES_USER: ecc
      POSTGRES_PASSWORD: ecc
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
    command: ["postgres", "-c", "log_statement=all", "-c", "max_connections=100"]

  collecte-pro:
    image: collecte:latest
    build: .
    env_file: .env
    environment:
      DATABASE_URL: "postgres://ecc:ecc@postgres:5432/ecc"
    depends_on:
      postgres:
        condition: service_started
    ports:
      - target: 8080
        published: 8080

volumes:
  postgres_data:
